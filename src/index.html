async function runAppend() {
    if (S.appendSelected.length < 2) return;
    const defaultName = `Birlesik_${new Date().toISOString().replace(/[:.]/g,'-').substring(0,19)}`;
    const newName = S.appendNewName.trim() || defaultName;

    S.L.append = true; render();
    try {
        const d = await API('/api/append/run', { fileNames: S.appendSelected, newName: newName });
        if (d.error) {
            alert(d.error);
        } else {
            await pollGeneric(d.task_id, r => {
                S.fileInfos = r.fileInfos || S.fileInfos;
                S.activeFileName = r.fileName;
                S.appendSelected = [];
                S.appendNewName = '';
                alert(`${r.fileName} başarıyla oluşturuldu ve aktif dataset olarak seçildi.`);
            });
        }
    } catch (e) {
        alert("Birleştirme hatası: " + e);
    }
    S.L.append = false; render();
}

const EXPORT_EXT = {xlsx:'.xlsx', csv:'.csv', txt:'.txt', tsv:'.tsv', json:'.json', parquet:'.parquet'};

function appendExportNameBase() {
  const fileName = document.getElementById('exportDataset')?.value || S.activeFileName || 'dataset';
  return document.getElementById('exportFileName')?.value || S.appendExportName || datasetBaseName(fileName);
}

function syncAppendExportExtension() {
  const pathInput = document.getElementById('exportOutputPath');
  if (!pathInput || !pathInput.value.trim()) return;
  const ext = EXPORT_EXT[S.appendExportFormat || 'xlsx'] || '.xlsx';
  const next = pathInput.value.replace(/\.(xlsx|csv|txt|tsv|json|parquet)$/i, '') + ext;
  pathInput.value = next;
  S.appendExportPath = next;
}

function syncAppendExportFormatFromPath() {
  const path = document.getElementById('exportOutputPath')?.value || S.appendExportPath || '';
  const m = path.match(/\.([a-z0-9]+)$/i);
  if (!m) return;
  const fmt = m[1].toLowerCase();
  if (!EXPORT_EXT[fmt]) return;
  S.appendExportFormat = fmt;
  const select = document.getElementById('exportFormat');
  if (select) select.value = fmt;
}

async function chooseAppendExportFile() {
  const format = document.getElementById('exportFormat')?.value || S.appendExportFormat || 'xlsx';
  const suggested = appendExportNameBase();
  if (window.pywebview && window.pywebview.api && window.pywebview.api.choose_export_file) {
    const result = await window.pywebview.api.choose_export_file(suggested, format);
    if (result && result.ok && result.path) {
      S.appendExportPath = result.path;
      const input = document.getElementById('exportOutputPath');
      if (input) input.value = result.path;
      syncAppendExportFormatFromPath();
      render();
      return;
    }
    if (result && result.cancelled) return;
    alert((result && result.error) || 'Dosya seçme penceresi açılamadı. Dosya yolunu elle girebilirsiniz.');
    return;
  }
  alert('Tarayıcı modunda Windows kaydetme penceresi açılamaz. Tam dosya yolunu elle girin veya mevcut dosyadan ad alın.');
}

function setAppendExportPathFromFile(input) {
  const file = input?.files?.[0];
  if (!file) return;
  const rawValue = input.value || '';
  const picked = rawValue && !rawValue.includes('fakepath') ? rawValue : file.name;
  S.appendExportPath = picked;
  const pathInput = document.getElementById('exportOutputPath');
  if (pathInput) pathInput.value = picked;
  syncAppendExportFormatFromPath();
}

function clearAppendExportTarget() {
  S.appendExportPath = '';
  S.appendExportFolder = S.outputFolder || 'JET_Ciktilari';
  const pathInput = document.getElementById('exportOutputPath');
  const folderInput = document.getElementById('exportFolder');
  if (pathInput) pathInput.value = '';
  if (folderInput) folderInput.value = S.appendExportFolder;
}

async function runExport() {
  const file_name = document.getElementById('exportDataset').value;
  const format = document.getElementById('exportFormat').value || S.appendExportFormat || 'xlsx';
  const encoding = document.getElementById('exportEncoding').value;
  const outputName = appendExportNameBase();
  const outputFolder = document.getElementById('exportFolder')?.value || S.appendExportFolder || S.outputFolder;
  const outputPath = document.getElementById('exportOutputPath')?.value || S.appendExportPath || '';

  if (!file_name) {
      alert("Lütfen dışa aktarılacak dataseti seçin.");
      return;
  }
  S.appendExportFormat = format;
  S.appendExportFolder = outputFolder;
  S.appendExportPath = outputPath;
  S.appendExportName = outputName;

  S.L.export = true; render();
  try {
    const d = await API('/api/append/export', {
      fileName: file_name,
      format: format,
      encoding: encoding,
      outputFolder,
      outputName,
      outputPath
    });

    if (d.error) {
      alert(d.error);
    } else {
        await pollGeneric(d.task_id, r => {
             S.exportResult = r.savedTo;
        });
    }
  } catch(e) {
    alert("Dışa aktarma hatası: " + e);
  }
  S.L.export = false; render();
}

      ${[2,3,4,5,6].map(n=>`<label style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer;">
        <input type="radio" name="mlen" value="${n}" style="width:18px;height:18px;accent-color:var(--pu);"
          ${S.matchLen===n?'checked':''} onchange="S.matchLen=${n};render()">
        ${n} Hane</label>`).join('')}
    </div>
  </div>
  <div class="sub" style="font-size:18px; margin-top:24px;">Aykırı (Unusual) Senaryo Kriterleri</div>
  <div class="klist">
    ${S.criteria.map((cr,i) => renderKritCard(cr,i)).join('')}
  </div>
  <button class="btn bl" onclick="addCriteria()" style="margin-bottom:24px; color:#000; font-size:14px; padding:10px 20px;">
    ➕ Yeni Senaryo Kriteri Ekle</button>

  <button class="btn pu" onclick="runUnusual()" ${!!(S.hesapCol && S.grupCol && S.criteria.length)?'':'disabled'} style="font-size:15px; padding: 12px 24px; width:100%; background:var(--rd); border-color:var(--rd);">
    🚀 Unusual Analizini Kuyruğa Ekle ve Başlat
  </button>`;
}

// ── Execution Triggers ──
async function runKullanici() {
  if (!S.userCol) return;
  saveProfile();
  const d = await API('/api/kullanici', {
    jetId: `JET-KUL-${(S.activeFileName||'').substring(0,10)}-${Math.floor(Math.random()*1000)}`,
    userCol:S.userCol, borcCol:S.borcCol, alacakCol:S.alacakCol,
    tutarKols:S.tutarKols, outputFolder:S.outputFolder,
    templatePath:S.profiles[S.activeFileName]?.templatePath || '', fileName:S.activeFileName,
  });
  if (d.error) { alert(d.error); return; }
  goStep(5);
}

async function runKelime() {
  if (!S.scanCols.length || !S.keywords.length) return;
  saveProfile();
  const d = await API('/api/kelime', {
    jetId: `JET-KEL-${(S.activeFileName||'').substring(0,10)}-${Math.floor(Math.random()*1000)}`,
    scanCols:S.scanCols, keywords:S.keywords, scanMode:S.scanMode,
    outputFolder:S.outputFolder, templatePath:S.profiles[S.activeFileName]?.templatePath || '',
    fileName:S.activeFileName,
  });
  if (d.error) { alert(d.error); return; }
  goStep(5);
}

async function runUnusual() {
  if (!S.hesapCol || !S.grupCol || !S.criteria.length) return;
  saveProfile();
  const d = await API('/api/unusual', {
    jetId: `JET-UNS-${(S.activeFileName||'').substring(0,10)}-${Math.floor(Math.random()*1000)}`,
    hesapCol:S.hesapCol, grupCol:S.grupCol,
    matchLen:S.matchLen, criteria:S.criteria,
    outputFolder:S.outputFolder, templatePath:S.profiles[S.activeFileName]?.templatePath || '',

  });
  if (d.error) { alert(d.error); return; }

}

// -- Unusual Criteria Card Helper --
function renderKritCard(cr, i) {
  return `<div class="kcard" style="box-shadow: 0 4px 6px rgba(0,0,0,0.04); border-left:4px solid var(--rd);">
  <div class="kcard-hdr">
    <span style="font-size:16px;font-weight:800;color:var(--rd); background:var(--rl); padding:4px 10px; border-radius:6px;">#${i+1}</span>
    <input class="kcard-nm" value="${esc(cr.name)}"
      placeholder="Senaryo Adı (Örn: Ciro-Kasa İlişkisi)" style="font-size:15px; font-weight:700;"
      oninput="S.criteria[${i}].name=this.value">
    ${S.criteria.length > 1
      ? `<button class="kcard-rm" onclick="S.criteria.splice(${i},1);render()">✕ Sil</button>`
      : ''}
  </div>
  <div class="kcols">
    <div style="background:var(--bg); padding:16px; border-radius:var(--r); border:1px solid #b6d4fe;">
      <div class="kclbl" style="color:#084298;"><span style="font-size:16px;">🏦</span> Ana Hesap Kodları</div>
      <div class="krow">
        <input class="kwi" id="ana_${i}" placeholder="Örn: 600, 601 → Enter" style="font-size:13px;"
          onkeydown="addKodCr(${i},'ana',event)">
        <button class="btn pu sm" onclick="addKodCrBtn(${i},'ana')">Ekle</button>
      </div>
      <div class="trow" style="min-height:36px; padding-top:8px;">
        ${cr.anaKodlar.map((k,j)=>`<div class="tag pu" style="font-size:14px;">${esc(k)}
          <button onclick="S.criteria[${i}].anaKodlar.splice(${j},1);render()">×</button></div>`).join('')}
      </div>
    </div>
    <div style="background:var(--bg); padding:16px; border-radius:var(--r); border:1px solid #9eeaf9;">
      <div class="kclbl" style="color:#055160;"><span style="font-size:16px;">🔄</span> Karşı Hesap Kodları</div>
      <div class="krow">
        <input class="kwi" id="karsi_${i}" placeholder="Örn: 100, 102 → Enter" style="font-size:13px;"
          onkeydown="addKodCr(${i},'karsi',event)">
        <button class="btn bl sm" onclick="addKodCrBtn(${i},'karsi')" style="color:#000;">Ekle</button>
      </div>
      <div class="trow" style="min-height:36px; padding-top:8px;">
        ${cr.karsiKodlar.map((k,j)=>`<div class="tag bl" style="font-size:14px;">${esc(k)}
          <button onclick="S.criteria[${i}].karsiKodlar.splice(${j},1);render()">×</button></div>`).join('')}
      </div>
    </div>
  </div>
</div>`;
}

function addCriteria() {
  S.criteria.push({ name:`Riskli Senaryo ${S.criteria.length+1}`, anaKodlar:[], karsiKodlar:[] });
  render();
}

function addKodCr(ci, type, e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const id  = type==='ana' ? `ana_${ci}` : `karsi_${ci}`;
    const arr = type==='ana' ? S.criteria[ci].anaKodlar : S.criteria[ci].karsiKodlar;
    document.getElementById(id).value.split(',')
      .map(x=>x.trim()).filter(Boolean)
      .forEach(x => { if (!arr.includes(x)) arr.push(x); });
    document.getElementById(id).value = '';
    render();
  }
}

function addKodCrBtn(ci, type) {
  const id  = type==='ana' ? `ana_${ci}` : `karsi_${ci}`;
  const arr = type==='ana' ? S.criteria[ci].anaKodlar : S.criteria[ci].karsiKodlar;
  document.getElementById(id).value.split(',')
    .map(x=>x.trim()).filter(Boolean)
    .forEach(x => { if (!arr.includes(x)) arr.push(x); });
  document.getElementById(id).value = '';
  render();
}

// ═══════════════════════════════════════════════════════════
// STEP 5 — TASK MONITOR (JET TAKİP)
// ═══════════════════════════════════════════════════════════
let _monTasks = [];
let _monStats = {};

function renderMonitor() {
  const tasks    = _monTasks;
  const active   = tasks.filter(t=>t.status==='RUNNING').length;
  const queued   = tasks.filter(t=>t.status==='QUEUED').length;
  const done     = tasks.filter(t=>t.status==='DONE').length;
  const failed   = tasks.filter(t=>t.status==='FAILED').length;
  const workers  = _monStats.workers || '—';

  return `
<div class="panel">
  <div class="pt"><span class="ico">📺</span>JET Takip Monitörü</div>
  <div class="info">ℹ️ Sistem arka planda birden fazla analizi aynı anda (paralel) çalıştırabilir. İşlemleri buradan takip edebilirsiniz. Her JET kendi çıktısını ayrı oluşturur.</div>

  <div class="stats" style="margin-bottom:24px">
    <div class="stat"><div class="sv">${workers}</div><div class="sl">Aktif Worker</div></div>
    <div class="stat" style="border-bottom:4px solid var(--pu);"><div class="sv" style="color:var(--pu)">${active}</div><div class="sl">Çalışan İşlem</div></div>
    <div class="stat" style="border-bottom:4px solid var(--am);"><div class="sv" style="color:var(--am)">${queued}</div><div class="sl">Kuyruktakiler</div></div>
    <div class="stat" style="border-bottom:4px solid var(--gr);"><div class="sv gr">${done}</div><div class="sl">Tamamlanan</div></div>
    <div class="stat" style="border-bottom:4px solid var(--rd);"><div class="sv rd">${failed}</div><div class="sl">Hatalı İşlem</div></div>
  </div>

  <div class="arow" style="margin-bottom:16px; background:var(--bg); padding:12px; border-radius:var(--r); border:1px solid var(--bd);">
    <span style="font-weight:700; font-size:14px; margin-right:auto;">Görev Geçmişi</span>
    <button class="btn gr sm" onclick="openFolder()"><span style="font-size:16px;">📁</span> Çıktı Klasörünü Aç</button>
    <button class="btn sm" onclick="refreshMonitor()"><span style="font-size:16px;">🔄</span> Yenile</button>
    <button class="btn sm rd" onclick="clearDoneTasks()"><span style="font-size:16px;">🗑️</span> Tamamlananları Temizle</button>
  </div>

  ${tasks.length === 0
    ? `<div style="text-align:center;padding:40px;background:var(--sf); border:1px dashed var(--mu); border-radius:var(--rl2); color:var(--mu)">
         <div style="font-size:48px; margin-bottom:12px;">💤</div>
         <div style="font-size:16px; font-weight:600;">Şu an çalışan veya kuyrukta bekleyen bir JET yok.</div>
       </div>`
    : `<div class="monitor">
        ${tasks.slice().reverse().map(t => renderTaskCard(t)).join('')}
       </div>`}

  <div class="nrow">
    <button class="btn" onclick="goStep(4)">← Yeni Analiz Başlat</button>
  </div>
</div>`;
}

function renderTaskCard(t) {
  return `<div class="tcard" style="border-left: 4px solid ${t.status==='RUNNING'?'var(--pu)':t.status==='DONE'?'var(--gr)':t.status==='FAILED'?'var(--rd)':'var(--am)'};">
  <div class="tcard-hdr">
    <span style="font-size:24px">${taskIcon(t)}</span>
    <div class="tcard-id" style="font-size:15px;">
      ${esc(t.jet_id||t.task_id)}
      ${t.kwargs?.file_name ? `<span class="bdg pu" style="margin-left:8px; font-size:10px;">Hedef: ${esc(t.kwargs.file_name)}</span>` : ''}
    </div>
    <span class="tcard-status ${t.status}" style="font-size:13px;">${statusLabel(t.status)}</span>
    ${t.status==='QUEUED'||t.status==='RUNNING'
      ? `<button class="btn sm rd" onclick="cancelTask('${t.task_id}')">✕ İptal</button>`
      : ''}
  </div>

  <div class="tprog" style="height:8px;">
    <div class="tprog-fill ${t.status}" style="width:${t.pct||0}%"></div>
  </div>

  <div class="tcard-meta" style="margin-top:12px;">
    <span style="font-weight:700; font-size:14px; background:transparent; border:none; padding:0;">📊 %${t.pct||0}</span>
    <span>⏱ Geçen: ${t.elapsed||0} sn</span>
    ${t.eta_sec > 0 ? `<span style="background:var(--al); color:#664d03; border-color:#ffe69c;">⏳ Kalan: ~${Math.round(t.eta_sec)} sn</span>` : ''}
    ${t.processed_rows > 0
      ? `<span>📄 ${t.processed_rows.toLocaleString('tr-TR')} satır işlendi</span>` : ''}
    ${t.message ? `<span style="flex-basis:100%;color:var(--pu); background:var(--pl); border-color:#b6d4fe; font-size:13px; padding:6px 10px;">💬 Durum: ${esc(t.message)}</span>` : ''}
  </div>

  ${t.error
    ? `<div class="tcard-err" style="font-size:13px;">⚠️ Hata Detayı: ${esc(t.error)}</div>` : ''}

  ${t.status === 'DONE' && t.result?.savedTo
    ? `<div class="tcard-res" style="font-size:13px; display:flex; justify-content:space-between; align-items:center;">
        <div>✅ Tamamlandı: <span style="font-family:monospace; font-weight:normal;">${esc(t.result.savedTo)}</span></div>
       </div>` : ''}
</div>`;
}

function taskIcon(t) {
  const id = (t.jet_id||'').toLowerCase();
  if (id.includes('load'))    return '📂';
  if (id.includes('kul')||id.includes('-k-')) return '👥';
  if (id.includes('kel')||id.includes('-kw-'))   return '🔍';
  if (id.includes('uns')||id.includes('-u-'))   return '⚠️';
  if (id.includes('append'))  return '🔗';
  if (id.includes('export'))  return '⬇️';
  if (id.includes('sheet'))   return '📋';
  return '⚙️';
}

function statusLabel(s) {
  return {QUEUED:'⏳ Kuyrukta',RUNNING:'▶ Çalışıyor',
          DONE:'✅ Tamamlandı',FAILED:'❌ Hata',
          CANCELLED:'⛔ İptal Edildi'}[s] || s;
}

async function refreshMonitor() {
  try {
    const d = await API('/api/all-tasks', {});
    _monTasks = d.tasks || [];
    _monStats = { workers: d.workers, active: d.active, queued: d.queued };
    if (S.step === 5) render();
  } catch(e) {}
}

function clearDoneTasks() {
  _monTasks = _monTasks.filter(t =>
    t.status === 'RUNNING' || t.status === 'QUEUED');
  if (S.step === 5) render();
}

function startMonitorPoll() {
  stopMonitorPoll();
  refreshMonitor();
  _monTimer = setInterval(refreshMonitor, 1500);
}

function stopMonitorPoll() {
  if (_monTimer) { clearInterval(_monTimer); _monTimer = null; }
}

// ═══════════════════════════════════════════════════════════
// POLL HELPERS
// ═══════════════════════════════════════════════════════════

// Generic task sonucunu bek (sheet reload vs.)
async function pollGeneric(taskId, onDone) {
  return new Promise(resolve => {
    const tick = async () => {
      try {
        const s = await API('/api/task-status', { task_id: taskId });
        if (s.status === 'DONE') { onDone(s.result); resolve(); }
        else if (s.status === 'FAILED') {
          alert(`İşlem Hatası: ${s.error}`); resolve();
        } else { setTimeout(tick, 400); }
      } catch(e) { setTimeout(tick, 600); }
    };
    tick();
  });
}

async function cancelTask(taskId) {
  await API('/api/cancel-task', { task_id: taskId });
  refreshMonitor();
}

// ═══════════════════════════════════════════════════════════
// COL SELECTOR
// ═══════════════════════════════════════════════════════════
function cSel({ label, req, sid, gid, skey, scls, tcls='pu' }) {
  const sel = S[skey];
  const cols = activeColumns();
  let multi = Array.isArray(sel);

  return `<div class="fg" style="margin-bottom:0;">
  <div class="fl" style="font-size:14px; margin-bottom:10px;">${label} ${req?'<span style="color:var(--rd); font-size:12px;">*</span>':'<span class="opt">(İsteğe Bağlı)</span>'}</div>
  <input class="cs" id="${sid}" placeholder="Kolon adını yazıp filtreleyin..."
    oninput="filterChips('${gid}',this.value)" style="background:var(--sf);">
  <div class="cgrid" id="${gid}" style="max-height: 140px; background:var(--sf);">
    ${cols.map(c=>{
        let isSel = multi ? sel.includes(c) : (sel === c);
        return `<div class="chip ${isSel?scls:''}"
      onclick="${multi ? `toggleArr('${skey}','${escQ(c)}')` : `selSingle('${skey}','${escQ(c)}')`}"
      title="${esc(c)}">${esc(c)}</div>`
    }).join('')}
  </div>
  <div style="min-height: 30px; margin-top: 10px;">
  ${(multi && sel.length)
    ? `<div class="trow">${sel.map(c=>`<div class="tag ${tcls}" style="font-size:14px; padding:6px 12px;">✅ ${esc(c)} <button onclick="toggleArr('${skey}','${escQ(c)}')">x</button></div>`).join('')}</div>`
    : (!multi && sel)
    ? `<div class="tag ${tcls}" style="font-size:14px; padding:6px 12px;">✅ Seçilen: <b>${esc(sel)}</b> <button onclick="selSingle('${skey}','${escQ(sel)}')">x</button></div>`
    : `<div class="help" style="margin:0;">Lütfen listeden uygun kolonu tıklayarak seçin.</div>`}
  </div>
</div>`;
}

// ═══════════════════════════════════════════════════════════
// VIRTUAL TABLE
// ═══════════════════════════════════════════════════════════
function dataGrid(cols, rows) {
  if (!cols?.length) return `<div style="padding:40px;text-align:center;color:var(--mu);font-size:16px;">Görüntülenecek veri yok</div>`;
  return `<table class="gridtbl">
    <thead><tr>${cols.map(c=>`<th title="${esc(c)}">${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>
      ${!rows?.length
        ? `<tr><td colspan="${cols.length}" style="text-align:center;color:var(--mu);padding:20px;">Kayıt bulunamadı</td></tr>`
        : rows.map(r=>`<tr>${cols.map(c=>`<td title="${esc(r[c]??'')}">${esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}
    </tbody>
  </table>`;
}

function limitedDataGrid(cols, rows, maxCols=30, maxRows=25) {
  const srcCols = cols || [];
  const shownCols = srcCols.slice(0, maxCols);
  const shownRows = (rows || []).slice(0, maxRows);
  const note = (srcCols.length > shownCols.length || (rows || []).length > shownRows.length)
    ? `<div class="help" style="padding:8px 12px;border-bottom:1px solid var(--bd);background:#fff;">Performans icin ${shownCols.length}/${srcCols.length} kolon ve ${shownRows.length}/${(rows||[]).length} satir gosteriliyor.</div>`
    : '';
  return note + dataGrid(shownCols, shownRows);
}

// ═══════════════════════════════════════════════════════════
// SYSTEM INFO
// ═══════════════════════════════════════════════════════════
async function updateSysInfo() {
  try {
    const d = await API('/api/system-info', {});
    if (!d.ok) return;
    document.getElementById('sysCpu').textContent    = d.cpu_pct;
    document.getElementById('sysRam').textContent    = d.proc_ram_mb;
    document.getElementById('sysCore').textContent   = d.cpu_count;
    document.getElementById('sysActive').textContent = d.active_tasks;
    document.getElementById('sysQueue').textContent  = d.queued_tasks;
    const dot = document.getElementById('sysDot');
    dot.className = 'sys-dot' +
      (d.cpu_pct > 85 ? ' hot' : d.cpu_pct > 60 ? ' warn' : '');

    if (S.step !== 5) { // 5 is now Monitor step
      const td = await API('/api/all-tasks', {});
      if (td.tasks) _monTasks = td.tasks;
    }
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function selSingle(k, v)  { S[k] = (S[k] === v) ? '' : v; render(); }
function toggleArr(k, v)  {
  const i = S[k].indexOf(v);
  i >= 0 ? S[k].splice(i,1) : S[k].push(v);
  render();
}
function filterChips(gid, q) {
  document.querySelectorAll('#'+gid+' .chip, #'+gid+' .gb-check').forEach(c => {
    const text = (c.title || c.textContent || '').toLowerCase();
    c.style.display = text.includes(q.toLowerCase()) ? '' : 'none';
  });
}
function handleKw(e) {
  if (e.key==='Enter'||e.key===',') {
    e.preventDefault();
    const inp = document.getElementById('kwInp');
    pushKws(inp.value); inp.value=''; render();
  }
}
function addKwBtn() {
  const inp = document.getElementById('kwInp');
  pushKws(inp.value); inp.value=''; render();
}
function pushKws(raw) {
  raw.split(',').map(x=>x.trim()).filter(Boolean)
    .forEach(x => { if (!S.keywords.includes(x)) S.keywords.push(x); });
}
async function openFolder() {
  await API('/api/open-folder', { folder: S.outputFolder });
}
function esc(s) {
  return String(s??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escQ(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
if (!S.criteria.length)
  S.criteria.push({ name:'Senaryo 1 (Örn: Hafta Sonu Fişleri)', anaKodlar:[], karsiKodlar:[] });

render();

_sysTimer = setInterval(updateSysInfo, 3000);
updateSysInfo();
</script>
